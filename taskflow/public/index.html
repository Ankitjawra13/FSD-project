<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskFlow</title>
<style>
  body{font-family:system-ui,sans-serif;background:#f4f5f9;margin:0;display:flex;justify-content:center;padding:40px 16px}
  .card{background:#fff;width:100%;max-width:480px;border-radius:14px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
  h1{margin:0 0 16px;color:#3b3bd6}
  form{display:flex;gap:8px;margin-bottom:16px}
  input[type=text]{flex:1;padding:10px;border:1px solid #ccd;border-radius:8px;font-size:15px}
  button{background:#3b3bd6;color:#fff;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}
  li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eee;list-style:none}
  ul{padding:0;margin:0} li span{flex:1} li.done span{text-decoration:line-through;color:#999}
  .del{background:#e5484d;padding:4px 10px} .meta{color:#777;font-size:13px;margin-top:12px}
</style>
</head>
<body>
<div class="card">
  <h1>TaskFlow</h1>
  <form id="f"><input type="text" id="t" placeholder="Add a task..." required><button>Add</button></form>
  <ul id="list"></ul>
  <div class="meta" id="count"></div>
</div>
<script>
const list = document.getElementById('list');
const api = (url, opts) => fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts }).then(r => r.json());

async function load() {
  const tasks = await api('/api/tasks');
  list.innerHTML = '';
  tasks.forEach(t => {
    const li = document.createElement('li');
    if (t.done) li.className = 'done';
    const cb = Object.assign(document.createElement('input'), { type: 'checkbox', checked: t.done });
    cb.onchange = async () => { await api('/api/tasks/' + t._id, { method: 'PATCH', body: JSON.stringify({ done: cb.checked }) }); load(); };
    const sp = document.createElement('span'); sp.textContent = t.title;
    const del = Object.assign(document.createElement('button'), { className: 'del', textContent: 'x' });
    del.onclick = async () => { await api('/api/tasks/' + t._id, { method: 'DELETE' }); load(); };
    li.append(cb, sp, del); list.append(li);
  });
  document.getElementById('count').textContent = tasks.filter(t => !t.done).length + ' of ' + tasks.length + ' tasks remaining';
}
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const i = document.getElementById('t');
  await api('/api/tasks', { method: 'POST', body: JSON.stringify({ title: i.value }) });
  i.value = ''; load();
};
load();
</script>
</body>
</html>
